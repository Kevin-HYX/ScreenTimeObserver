<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一天的轨迹 · 屏幕时间</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><a class="brand" href="/" aria-label="屏幕时间首页"><span class="brand-icon">◷</span><span>屏幕时间</span></a><div class="header-right"><span id="status" class="badge">正在连接…</span><button id="openSettings">设置</button></div></header>
<main>
<section class="intro"><div><h1>一天的轨迹<span class="blue">.</span></h1></div><div class="date-tools"><button id="prevDate" aria-label="前一天">←</button><input type="date" id="date" aria-label="选择日期"><button id="nextDate" aria-label="后一天">→</button><button id="today">今天</button></div></section>
<div id="notice" class="notice" role="status" hidden></div>
<section class="metrics" aria-label="使用概览"><article class="metric primary"><div title="活跃操作与媒体播放的合计">有效使用 <span>↗</span></div><strong id="effective">—</strong></article><article class="metric"><div>活跃操作 <span>⌘</span></div><strong id="active">—</strong></article><article class="metric"><div>空闲时间 <span>◷</span></div><strong id="idle">—</strong></article></section>
<p id="coverage" class="coverage">正在读取本地记录…</p>
<section class="panel recall" id="recall"><div class="section-head"><div><h2>活动回顾</h2></div><div class="recall-actions"><button id="fullscreenRecall" aria-pressed="false">全屏回顾 ⛶</button><button id="live">回到最新 ↗</button></div></div><p id="fullscreenError" role="status" hidden></p>
<div class="recall-body"><div class="preview"><div class="preview-top"><span>桌面快照</span><span id="shotTime"></span></div><button class="image-stage" id="expandShot" aria-label="放大桌面截图" disabled><img id="shot" alt="所选时间的桌面截图" hidden><span id="shotEmpty">选择时间查看截图</span></button><div class="preview-foot"><span id="shotAge"></span></div></div><aside class="activity"><div class="recall-date-tools"><button id="recallPrevDate" aria-label="回顾前一天">←</button><input type="date" id="recallDate" aria-label="回顾日期"><button id="recallNextDate" aria-label="回顾后一天">→</button><button id="recallToday">今天</button></div><strong class="clock" id="cursorTime">—:—:—</strong><span class="badge" id="kind">等待数据</span><h3 id="process">—</h3><p id="title"></p><p id="segmentInfo" class="muted"></p><section class="recall-app-filter" aria-label="回顾应用筛选"><div class="recall-filter-head"><strong>应用筛选</strong><button id="recallClearFilter">全部</button></div><div id="recallApps" class="recall-app-list"></div></section></aside></div>
<div class="timeline-head"><strong id="timelineLabel">全天活动</strong><div><label>视野 <select id="zoom"><option value="24">全天</option><option value="12">12 小时</option><option value="6">6 小时</option><option value="3">3 小时</option><option value="1">1 小时</option><option value="0.5">30 分钟</option><option value="0.25">15 分钟</option></select></label></div></div>
<div class="timeline-wrap"><canvas id="timeline" aria-label="应用与状态时间轴"></canvas><input id="scrubber" type="range" min="0" max="86400" step="1" value="0" aria-label="回顾时间"><div id="ticks" class="ticks"></div></div>
<div class="legend"><span><i class="dot active"></i>活跃操作</span><span><i class="dot media"></i>媒体播放</span><span><i class="dot idle"></i>空闲 / 锁屏</span><span><i class="dot suspended"></i>休眠</span><span><i class="dot paused"></i>人工暂停</span><span><i class="dot unknown"></i>未采集</span></div>
</section>
<section class="bottom-grid"><article class="panel"><div class="section-head"><div><h2>应用使用</h2></div><button id="clearFilter" hidden>清除筛选</button></div><div id="apps"></div><button id="allApps" hidden>展开全部应用</button></article><article class="panel week-panel"><div class="section-head"><div><h2>最近七天</h2></div></div><div id="week" class="week"></div><div id="weekLegend" class="legend" aria-label="最近七天图例"><span><i class="dot week-selected"></i>有效使用</span></div><p id="weekNote" class="hint"></p></article></section>
<section class="panel details"><div class="section-head"><div><h2>活动明细</h2></div><div class="filters"><input type="search" id="search" placeholder="搜索应用或窗口标题" aria-label="搜索活动"><select id="kindFilter" aria-label="筛选状态"><option value="">全部状态</option><option value="active">活跃操作</option><option value="media">媒体播放</option><option value="idle">空闲</option><option value="paused">暂停</option><option value="suspended">休眠</option><option value="locked">锁屏</option><option value="unknown">未采集</option></select></div></div><div class="range-filter"><span>统计范围</span><input type="time" id="from" value="00:00" aria-label="范围开始"><span>至</span><input type="time" id="to" value="23:59" aria-label="范围结束"><button id="applyRange">应用范围</button><button id="resetRange" hidden>恢复全天</button><span id="rangeLabel" class="muted small">全天</span></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>应用 / 窗口标题</th><th>状态</th><th>时长</th></tr></thead><tbody id="rows"></tbody></table></div><button id="more" hidden>加载更多</button></section>
<footer><span id="updated"></span></footer>
</main>
<dialog id="lightbox"><div class="dialog-head"><strong>原尺寸桌面截图</strong><div><button id="fitShot">适应窗口 / 原尺寸</button><button id="closeShot">关闭 ✕</button></div></div><div class="image-scroll"><img id="largeShot" alt="原尺寸桌面截图"></div></dialog>
<dialog id="settingsDialog" aria-labelledby="settingsHeading"><form id="settingsForm">
<div class="section-head"><h2 id="settingsHeading">截图设置</h2><button type="button" id="closeSettings" aria-label="关闭设置">✕</button></div>
<label class="settings-field">截图保存时间<div><input id="retentionHours" type="number" min="1" max="720" step="1" required> 小时</div></label>
<label class="settings-field">截图频率<div>每 <input id="intervalSeconds" type="number" min="10" max="3600" step="1" required> 秒一张</div></label>
<p class="muted small">保存后直接生效。过期截图约每 10 分钟清理一次。</p>
<label id="shorterWarning" class="settings-warning" hidden><input id="confirmShorter" type="checkbox">我确认缩短保存时间，允许后续清理删除超过新期限的截图，此操作不可恢复。</label>
<p id="settingsMessage" role="status"></p><button id="saveSettings" type="submit">保存设置</button>
</form></dialog>
</body></html>
